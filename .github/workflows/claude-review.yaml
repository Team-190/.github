name: Claude Draft Review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      CLAUDE_REVIEWER_PAT:
        required: true

jobs:
  draft-review:
    name: Claude Draft Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout shared review prompt
        uses: actions/checkout@v4
        with:
          repository: Team-190/.github
          sparse-checkout: |
            claude-review-prompt.md
          sparse-checkout-cone-mode: false
          path: .team-190-github

      - name: Read review prompt
        id: prompt
        run: |
          {
            echo 'content<<PROMPT_EOF'
            cat .team-190-github/claude-review-prompt.md
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # review-guard's pending-review tools attribute reviews/comments to whichever
      # token authenticates it, so this uses ElliotScher's own PAT (CLAUDE_REVIEWER_PAT)
      # rather than the default GITHUB_TOKEN or the Claude GitHub App, so the pending
      # review shows up under his account, not a bot's.
      #
      # Deliberately not passing --allow-submit: without it, review-guard never
      # registers a submit tool at all, so submitting/approving/requesting changes is
      # structurally unreachable, not just discouraged by the prompt. Scoped to this
      # one PR with --repo/--pr so a run can only ever touch the PR it was triggered for.
      - name: Write review-guard MCP server config
        env:
          CLAUDE_REVIEWER_PAT: ${{ secrets.CLAUDE_REVIEWER_PAT }}
        run: |
          cat > "${RUNNER_TEMP}/mcp-config.json" <<EOF
          {
            "mcpServers": {
              "review_guard": {
                "command": "npx",
                "args": [
                  "-y", "@eclipsesource/review-guard-mcp@0.3.0", "--stdio",
                  "--repo", "${{ github.repository }}",
                  "--pr", "${{ github.event.pull_request.number }}"
                ],
                "env": { "GITHUB_TOKEN": "${CLAUDE_REVIEWER_PAT}" }
              }
            }
          }
          EOF

      - name: Claude draft review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            ${{ steps.prompt.outputs.content }}

            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            The PR branch is already checked out at HEAD with full history. Diff it against
            origin/${{ github.event.pull_request.base.ref }} to see exactly what changed, then read
            whatever surrounding file context you need to judge each change. Leave your findings as
            pending review comments per the instructions above, authenticated as ElliotScher through
            the review_guard MCP server.
          claude_args: |
            --mcp-config ${{ runner.temp }}/mcp-config.json
            --allowedTools "mcp__review_guard__get_pr_review_context,mcp__review_guard__list_pending_review,mcp__review_guard__add_review_comments,mcp__review_guard__modify_review_comment,mcp__review_guard__delete_pending_review"
